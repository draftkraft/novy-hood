; Novy Pureline RF bridge — ESP32-C3 + CC1101 (433.92 MHz OOK, RCSwitch proto 12)
;
; Two build environments share one src/ folder; build_src_filter selects the file:
;   pio run -e sniffer -t upload -t monitor   -> capture your remote's codes
;   pio run -e novy    -t upload -t monitor   -> replay codes to control the hood
;
; Wiring (CC1101 -> ESP32-C3, all 3.3V):
;   VCC->3V3  GND->GND  SCK->GPIO4  MISO->GPIO5  MOSI->GPIO6  CSN->GPIO7  GDO0->GPIO10

[env]
; was: platform = espressif32  (arduino-esp32 2.0.17). Testing newer core:
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; ESP32-C3 SuperMini talks over its native USB-Serial/JTAG:
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    sui77/rc-switch@^2.6.4
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
    knolleary/PubSubClient@^2.8

[env:sniffer]
build_src_filter = +<sniffer.cpp>

[env:novy]
build_src_filter = +<transmit.cpp>

[env:rawsniff]
build_src_filter = +<rawsniff.cpp>

; Full WiFi + web controller (renedis port on CC1101)
[env:hood]
build_src_filter = +<hoodserver.cpp>
; Larger app slots (1.875 MB) so TLS + HTTPUpdate fit and leave OTA headroom.
; NOTE: changing the partition table requires a one-time USB factory flash; OTA can't rewrite it.
board_build.partitions = min_spiffs.csv
; Inject FW_VERSION from VERSION at build time; see tools/version.py.
extra_scripts = pre:tools/version.py

; Bare-minimum WiFi isolation test
[env:wifitest]
build_src_filter = +<wifitest.cpp>
